<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>91 Dub CGM – Settings</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #333; color: #fff; font: 15px/1.4 -apple-system, "Helvetica Neue", Roboto, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 8px 10px 90px; }
  h1 { font-size: 22px; text-align: center; margin: 14px 0 6px; color: #ff4700; }
  .sub { text-align: center; color: #aaa; font-size: 12px; margin-bottom: 10px; }
  section { background: #484848; border-radius: 6px; margin: 12px 0; padding: 4px 12px 8px; }
  h2 { font-size: 17px; margin: 8px 0; color: #ff4700; }
  h4 { font-size: 13px; margin: 14px 0 4px; color: #ccc; text-transform: uppercase; letter-spacing: .04em; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid #5a5a5a; }
  .row:last-child { border-bottom: 0; }
  .row > label:first-child { flex: 1; }
  .desc { font-size: 12px; color: #bbb; padding: 0 0 6px; }
  .text { font-size: 13px; color: #ccc; padding: 6px 0; }
  .text a { color: #ff8a50; }
  select, input[type=text], input[type=url], input[type=number] { background: #333; color: #fff; border: 1px solid #666; border-radius: 4px; padding: 6px 8px; font-size: 15px; max-width: 60%; }
  input[type=url], input[type=text] { width: 60%; }
  input[type=number] { width: 90px; }
  .toggle { position: relative; width: 46px; height: 26px; flex: none; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle span { position: absolute; inset: 0; background: #666; border-radius: 13px; transition: .15s; }
  .toggle span:before { content: ""; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
  .toggle input:checked + span { background: #ff4700; }
  .toggle input:checked + span:before { transform: translateX(20px); }
  .swatch { width: 46px; height: 28px; border: 2px solid #999; border-radius: 4px; flex: none; cursor: pointer; }
  .radios label { margin-left: 12px; }
  textarea { width: 100%; height: 120px; background: #333; color: #fff; border: 1px solid #666; font: 11px monospace; }
  button { background: #ff4700; color: #fff; border: 0; border-radius: 4px; padding: 10px 16px; font-size: 16px; cursor: pointer; }
  .save { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px; background: #222; text-align: center; }
  .save button { width: 100%; max-width: 500px; }
  .preview { padding: 12px 0; }
  .preview > div { display: flex; justify-content: center; }
  details > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary h2 { margin: 8px 0; }
  details > summary:after { content: "▸"; color: #ff4700; font-size: 18px; transition: .15s; }
  details[open] > summary:after { transform: rotate(90deg); }
  section.more { background: #3d3d3d; }
  .picker { display: flex; gap: 6px; align-items: center; padding: 8px 0; }
  .picker select { flex: 1; min-width: 0; max-width: none; }
  .picker button { padding: 6px 12px; font-size: 18px; line-height: 1; }
  #palette { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: none; align-items: center; justify-content: center; z-index: 10; }
  #palette .grid { display: grid; grid-template-columns: repeat(8, 36px); gap: 4px; background: #222; padding: 10px; border-radius: 6px; }
  #palette .grid div { width: 36px; height: 36px; border-radius: 3px; cursor: pointer; border: 1px solid #555; }
</style>
</head>
<body>
<main id="app"><h1>91 Dub CGM</h1><div class="sub">loading…</div></main>
<div class="save"><button id="save">Save Settings</button></div>
<div id="palette"><div class="grid"></div></div>
<script src="preview.js"></script>
<script src="i18n.js"></script>
<script>
(function() {
  'use strict';
  // ── Settings passed in by the phone (URL fragment #config=…) ────────────
  function readConfig() {
    var m = /[#&]config=([^&]*)/.exec(location.hash);
    if (!m) return {};
    try { return JSON.parse(decodeURIComponent(m[1])) || {}; } catch (e) { return {}; }
  }
  function returnTo() {
    var m = /[?&]return_to=([^&]*)/.exec(location.search);
    return m ? decodeURIComponent(m[1]) : 'pebblejs://close#';
  }
  var saved = readConfig();
  // Language: stored setting, otherwise the phone's language
  if (saved.Language === undefined) saved.Language = /^de/i.test(navigator.language || '') ? '1' : '0';
  function T(txt) {
    var d = (window.DUB_I18N || {})[String(saved.Language) === '1' ? 'de' : ''];
    return (d && d[txt]) || txt;
  }

  var SUNLIGHT = {
    '000000':'000000','000055':'001e41','0000aa':'004387','0000ff':'0068ca','005500':'2b4a2c','005555':'27514f','0055aa':'16638d','0055ff':'007dce',
    '00aa00':'5e9860','00aa55':'5c9b72','00aaaa':'57a5a2','00aaff':'4cb4db','00ff00':'8ee391','00ff55':'8ee69e','00ffaa':'8aebc0','00ffff':'84f5f1',
    '550000':'4a161b','550055':'482748','5500aa':'40488a','5500ff':'2f6bcc','555500':'564e36','555555':'545454','5555aa':'4f6790','5555ff':'4180d0',
    '55aa00':'759a64','55aa55':'759d76','55aaaa':'71a6a4','55aaff':'69b5dd','55ff00':'9ee594','55ff55':'9de7a0','55ffaa':'9becc2','55ffff':'95f6f2',
    'aa0000':'99353f','aa0055':'983e5a','aa00aa':'955694','aa00ff':'8f74d2','aa5500':'9d5b4d','aa5555':'9d6064','aa55aa':'9a7099','aa55ff':'9587d5',
    'aaaa00':'afa072','aaaa55':'aea382','aaaaaa':'ababab','aaaaff':'a7bae2','aaff00':'c9e89d','aaff55':'c9eaa7','aaffaa':'c7f0c8','aaffff':'c3f9f7',
    'ff0000':'e35462','ff0055':'e25874','ff00aa':'e16aa3','ff00ff':'de83dc','ff5500':'e66e6b','ff5555':'e6727c','ff55aa':'e37fa7','ff55ff':'e194df',
    'ffaa00':'f1aa86','ffaa55':'f1ad93','ffaaaa':'efb5b8','ffaaff':'ecc3eb','ffff00':'ffeeab','ffff55':'fff1b5','ffffaa':'fff6d3','ffffff':'ffffff'
  };
  var PALETTE = Object.keys(SUNLIGHT);

  function toInt(v) {
    if (typeof v === 'number') return v;
    var n = parseInt(String(v).replace(/^(0x|#)/, ''), 16);
    return isNaN(n) ? 0 : n;
  }
  // snap any colour to the 64-colour Pebble palette
  function snap(n) {
    var c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(function(x) { return Math.round(x / 85) * 85; });
    return (c[0] << 16) | (c[1] << 8) | c[2];
  }
  function hex6(n) { return ('000000' + n.toString(16)).slice(-6); }
  function displayHex(n) { return '#' + (SUNLIGHT[hex6(n)] || hex6(n)); }

  // ── Item registry ───────────────────────────────────────────────────────
  var items = [];            // {cfg, get(), set(v), el}
  var byKey = {}, byId = {};
  var listeners = [];        // fn(item) on any change
  function changed(it) { listeners.forEach(function(fn) { fn(it); }); }

  function h(tag, attrs, children) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function(k) {
      if (k === 'html') e.innerHTML = attrs[k];
      else if (k === 'text') e.textContent = attrs[k];
      else e.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function(c) { if (c) e.appendChild(c); });
    return e;
  }

  function initial(cfg) {
    if (cfg.messageKey && saved[cfg.messageKey] !== undefined) return saved[cfg.messageKey];
    return cfg.defaultValue;
  }

  // colour palette dialog
  var pal = document.getElementById('palette');
  var palGrid = pal.querySelector('.grid');
  var palTarget = null;
  PALETTE.forEach(function(hx) {
    var d = h('div');
    d.style.background = '#' + (SUNLIGHT[hx] || hx);
    d.title = '#' + hx.toUpperCase();
    d.onclick = function(ev) { ev.stopPropagation(); if (palTarget) palTarget(parseInt(hx, 16)); pal.style.display = 'none'; };
    palGrid.appendChild(d);
  });
  pal.onclick = function() { pal.style.display = 'none'; };

  function render(cfg, parent) {
    var it = { cfg: cfg }, row, input;
    switch (cfg.type) {
      case 'heading':
        parent.appendChild(h(cfg.size ? 'h4' : 'h2', { html: T(cfg.defaultValue) }));
        return;
      case 'text':
        parent.appendChild(h('div', { 'class': 'text', html: T(cfg.defaultValue) }));
        return;
      case 'section':
        var sec = h('section'), body = sec, list = cfg.items;
        if (cfg.collapsed) {
          // collapsed section: first heading becomes the tap-to-open summary
          sec.className = 'more';
          body = h('details');
          body.appendChild(h('summary', {}, [h('h2', { html: T(list[0].defaultValue) })]));
          sec.appendChild(body);
          list = list.slice(1);
        }
        list.forEach(function(c) { render(c, body); });
        parent.appendChild(sec);
        return;
      case 'submit':
        return;
      case 'toggle':
        input = h('input', { type: 'checkbox' });
        input.checked = initial(cfg) === true || initial(cfg) === 1 || initial(cfg) === '1';
        row = h('div', { 'class': 'row' }, [h('label', { text: T(cfg.label) }), h('label', { 'class': 'toggle' }, [input, h('span')])]);
        it.get = function() { return input.checked; };
        it.set = function(v) { input.checked = !!v; };
        input.onchange = function() { changed(it); };
        break;
      case 'select':
        input = h('select');
        cfg.options.forEach(function(o) { input.appendChild(h('option', { value: o.value, text: T(o.label) })); });
        input.value = String(initial(cfg));
        row = h('div', { 'class': 'row' }, [h('label', { text: T(cfg.label) }), input]);
        it.get = function() { return input.value; };
        it.set = function(v) { input.value = String(v); };
        input.onchange = function() { changed(it); };
        break;
      case 'input':
        var at = cfg.attributes || {};
        input = h('input', { type: at.type || 'text', placeholder: at.placeholder || '', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false' });
        if (at.step) input.step = at.step;
        input.value = initial(cfg) == null ? '' : String(initial(cfg));
        row = h('div', { 'class': 'row' }, [h('label', { text: T(cfg.label) }), input]);
        it.get = function() { return input.value.trim(); };
        it.set = function(v) { input.value = v; };
        input.oninput = function() { changed(it); };
        break;
      case 'radiogroup':
        var name = 'r' + items.length, radios = [];
        var box = h('div', { 'class': 'radios' });
        cfg.options.forEach(function(o) {
          var r = h('input', { type: 'radio', name: name, value: o.value });
          r.checked = String(initial(cfg)) === o.value;
          r.onchange = function() { changed(it); };
          radios.push(r);
          box.appendChild(h('label', {}, [r, document.createTextNode(' ' + T(o.label))]));
        });
        row = h('div', { 'class': 'row' }, [h('label', { text: T(cfg.label) }), box]);
        it.get = function() { for (var i = 0; i < radios.length; i++) if (radios[i].checked) return radios[i].value; return cfg.defaultValue; };
        it.set = function(v) { radios.forEach(function(r) { r.checked = r.value === String(v); }); };
        break;
      case 'color':
        var val = snap(toInt(initial(cfg)));
        var sw = h('div', { 'class': 'swatch' });
        function paint() { sw.style.background = cfg.sunlight === false ? '#' + hex6(val) : displayHex(val); }
        paint();
        sw.onclick = function() { palTarget = function(v) { it.set(v); changed(it); }; pal.style.display = 'flex'; };
        row = h('div', { 'class': 'row' }, [h('label', { text: T(cfg.label) }), sw]);
        it.get = function() { return val; };
        it.set = function(v) { val = snap(toInt(v)); paint(); };
        break;
      case 'themepicker':
        // preset select with ◀ ▶ (and random) to flip through the themes
        input = h('select');
        cfg.options.forEach(function(o) { input.appendChild(h('option', { value: o.value, text: T(o.label) })); });
        input.value = '';
        var step = function(d) {
          var n = cfg.options.length - 1, i = input.selectedIndex;   // 0 = "Select a Theme"
          if (d === 0) i = 1 + Math.floor(Math.random() * n);
          else if (i === 0) i = d > 0 ? 1 : n;
          else i = ((i - 1 + d + n) % n) + 1;
          input.selectedIndex = i;
          changed(it);
        };
        var btn = function(txt, title, d) {
          var b = h('button', { type: 'button', text: txt, title: T(title), 'aria-label': T(title) });
          b.onclick = function() { step(d); };
          return b;
        };
        row = h('div', {}, [h('label', { text: T(cfg.label) }),
          h('div', { 'class': 'picker' }, [btn('◀', 'Previous preset', -1), input,
            btn('▶', 'Next preset', 1), btn('⚄', 'Random preset', 0)])]);
        it.get = function() { return input.value; };
        it.set = function(v) { input.value = String(v); };
        input.onchange = function() { changed(it); };
        break;
      case 'preview':
        var tpl = window.DUB_PREVIEW.template;
        if (String(saved.Language) === '1') {
          [['WED 22', 'MI 22']].forEach(function(r) { tpl = tpl.split(r[0]).join(r[1]); });
        }
        row = h('div', { 'class': 'preview', html: tpl });
        it.root = row;
        it.get = function() {};
        break;
      case 'themeexport':
        input = h('textarea', { readonly: 'readonly' });
        row = input;
        it.get = function() {};
        it.set = function(v) { input.value = v; };
        break;
      case 'button':
        input = h('button', { type: 'button', text: T(cfg.defaultValue) });
        row = h('div', { 'class': 'row' }, [input]);
        input.onclick = function() { if (it.onclick) it.onclick(); };
        it.get = function() {};
        break;
      default:
        return;
    }
    parent.appendChild(row);
    it.row = row;
    if (cfg.description) parent.appendChild(h('div', { 'class': 'desc', text: T(cfg.description) }));
    items.push(it);
    if (cfg.messageKey) byKey[cfg.messageKey] = it;
    if (cfg.id) byId[cfg.id] = it;
  }

  // ── Preview + themes (logic from 91 Dub v5 plus' custom-clay.js) ─────────
  var colorKeys = ['bg1','bg2','bg3','bg4','bi1','bi2','bi3','bi4','bl1','bl2','bl3','bl4',
                   'd1','d2','d3','d4','d5','d6','d7','d8','d9','t1','t2','t3','t4','h1','h2'];
  var SVG_FILL = ['bl1', 'd4', 'd5'], SVG_STROKE = ['bl2', 'd3'], BORDER_KEYS = ['d1', 'd2'];

  function currentSet() { return byId.ColorSet ? byId.ColorSet.get() : '1'; }
  function updatePreview(setNum) {
    paintPreview(setNum, byId['PreviewSet' + setNum]);
    if (String(setNum) === currentSet()) paintPreview(setNum, byId.PreviewTheme);
  }
  function paintPreview(setNum, pv) {
    if (!pv) return;
    colorKeys.forEach(function(key) {
      var it = byKey['Set' + setNum + '_' + key];
      if (!it) return;
      var hx = displayHex(it.get());
      var elems = pv.root.querySelectorAll('.color-' + key);
      for (var e = 0; e < elems.length; e++) {
        var prop = elems[e].getAttribute('data-preview-prop');
        if (prop) elems[e].style[prop] = hx;
        else if (SVG_FILL.indexOf(key) >= 0) elems[e].setAttribute('fill', hx);
        else if (SVG_STROKE.indexOf(key) >= 0) elems[e].setAttribute('stroke', hx);
        else if (BORDER_KEYS.indexOf(key) >= 0) elems[e].style.borderTopColor = hx;
        else if (key.indexOf('bg') === 0) elems[e].style.backgroundColor = hx;
        else elems[e].style.color = hx;
      }
    });
  }

  function applyTheme(name) {
    var set = currentSet();
    (window.DUB_THEMES || []).some(function(t) {
      var td = t.theme[0];
      if (td.name !== name) return false;
      colorKeys.forEach(function(k) {
        var it = byKey['Set' + set + '_' + k];
        if (it && td[k + 'color']) it.set(td[k + 'color']);
      });
      return true;
    });
    updatePreview(1);
    updatePreview(2);
  }

  function exportThemes() {
    return JSON.stringify([1, 2].map(function(set) {
      var th = { name: 'Custom Theme ' + set };
      colorKeys.forEach(function(k) {
        var it = byKey['Set' + set + '_' + k];
        if (it) th[k + 'color'] = '#' + hex6(it.get()).toUpperCase();
      });
      return { theme: [th] };
    }), null, 2);
  }

  // ── Units: thresholds follow the unit switch ─────────────────────────────
  function unitSwitched() {
    var mmol = byKey.CgmUnits.get() === '1';
    [['CgmHigh', 180, 10], ['CgmLow', 70, 3.9]].forEach(function(t) {
      var it = byKey[t[0]], v = parseFloat(String(it.get()).replace(',', '.'));
      if (!isFinite(v)) { it.set(mmol ? t[2] : t[1]); return; }
      if (mmol && v >= 40) it.set(Math.round(v / 18 * 10) / 10);
      if (!mmol && v < 40) it.set(Math.round(v * 18));
    });
  }

  // Set 1/2 choice only matters when colour set switching is on
  function showColorSet() {
    var cs = byId.ColorSet, sw = byKey.SwitchSet;
    if (!cs || !sw) return;
    var row = cs.row;
    row.style.display = sw.get() === '0' ? 'none' : '';
    if (sw.get() === '0' && cs.get() !== '1') { cs.set('1'); updatePreview(1); }
  }

  function currentValues() {
    var out = {};
    items.forEach(function(it) {
      if (it.cfg.messageKey) out[it.cfg.messageKey] = it.get();
    });
    return out;
  }

  var styled = false;
  function build() {
    var app = document.getElementById('app');
    app.innerHTML = '';
    items = []; byKey = {}; byId = {}; listeners = [];
    if (!styled) {
      var style = document.createElement('style');
      style.textContent = window.DUB_PREVIEW.style;
      document.head.appendChild(style);
      styled = true;
    }
    document.title = '91 Dub CGM – ' + T('Settings');
    document.getElementById('save').textContent = T('Save Settings');
    window.DUB_CONFIG.forEach(function(c) { render(c, app); });
    if (!saved.CgmHigh && saved.CgmUnits === '1') unitSwitched();

    listeners.push(function(it) {
      var k = it.cfg.messageKey || '';
      if (/^Set1_/.test(k)) updatePreview(1);
      if (/^Set2_/.test(k)) updatePreview(2);
      if (it.cfg.id === 'Theme') applyTheme(it.get());
      if (it.cfg.id === 'ColorSet') { if (byId.Theme) byId.Theme.set(''); updatePreview(currentSet()); }
      if (k === 'SwitchSet') showColorSet();
      if (k === 'CgmUnits') unitSwitched();
      if (k === 'Language') {
        // re-render in the new language, keeping every current value
        var open = [].map.call(document.querySelectorAll('details'), function(d) { return d.open; });
        saved = currentValues();
        build();
        [].forEach.call(document.querySelectorAll('details'), function(d, i) { d.open = !!open[i]; });
      }
    });
    showColorSet();
    if (byId.ExportThemes) byId.ExportThemes.onclick = function() { byId.ThemeExport.set(exportThemes()); };
    updatePreview(1);
    updatePreview(2);
  }

  document.getElementById('save').onclick = function() {
    var out = currentValues();
    location.href = returnTo() + encodeURIComponent(JSON.stringify(out));
  };

  fetch('themes.json').then(function(r) { return r.json(); }).catch(function() { return []; }).then(function(t) {
    window.DUB_THEMES = t;
    var s = document.createElement('script');
    s.src = 'schema.js';
    s.onload = build;
    document.body.appendChild(s);
  });
})();
</script>
</body>
</html>
